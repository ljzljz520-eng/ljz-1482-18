version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: cw-db
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench_pwd
      POSTGRES_DB: workbench
    volumes:
      - cw-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - cw-net

  backend:
    build: ./backend
    container_name: cw-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://workbench:workbench_pwd@db:5432/workbench?schema=public
      JWT_SECRET: workbench-demo-secret-2026
      JWT_EXPIRES_IN: 8h
      PORT: "8000"
      NODE_ENV: production
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - cw-net

  frontend:
    build: ./frontend
    container_name: cw-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - cw-net

volumes:
  cw-pgdata:

networks:
  cw-net:
    driver: bridge
